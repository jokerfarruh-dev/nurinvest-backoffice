name: Sync Indicators

on:
  schedule:
    - cron: '0,30 14-21 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync RSI, SMA, MACD
        run: |
          curl -sf -X POST \
            "https://whgxnmauvfzdwyzvgesr.supabase.co/functions/v1/sync-indicators" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
