name: Sync Prices

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync market_data from FMP
        run: |
          curl -sf -X POST \
            "https://whgxnmauvfzdwyzvgesr.supabase.co/functions/v1/sync-prices" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
