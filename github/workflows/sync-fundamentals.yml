name: Sync Fundamentals

on:
  schedule:
    - cron: '0 6 1 3,6,9,12 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync PE, ROE, margins
        run: |
          curl -sf -X POST \
            "https://whgxnmauvfzdwyzvgesr.supabase.co/functions/v1/sync-fundamentals" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"force": true}'
